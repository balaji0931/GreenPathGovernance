services:
  - type: web
    name: greenpath-governance
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn greenpath.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false

