{% extends 'base.html' %}

{% block title %}Server Error (500) | GreenPath{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-16 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-lg space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center">
            <i data-lucide="server-off" class="w-8 h-8"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-slate-900">System Unavailable</h1>
            <p class="text-sm text-slate-600">
                An internal service or database interruption occurred. Our technical staff has been notified.
            </p>
        </div>
        <div class="pt-2">
            <a href="{% url 'landing' %}" class="inline-flex items-center space-x-2 px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Return to Home</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
