{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-2">
    {% for message in messages %}
    <div class="flex items-center p-4 mb-3 rounded-xl border text-sm font-medium shadow-sm transition-all duration-200
        {% if message.tags == 'success' %}
            bg-emerald-50 text-emerald-800 border-emerald-200
        {% elif message.tags == 'error' or message.tags == 'danger' %}
            bg-rose-50 text-rose-800 border-rose-200
        {% elif message.tags == 'warning' %}
            bg-amber-50 text-amber-800 border-amber-200
        {% else %}
            bg-blue-50 text-blue-800 border-blue-200
        {% endif %}
    " role="alert">
        <div class="mr-3 flex-shrink-0">
            {% if message.tags == 'success' %}
                <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>
            {% elif message.tags == 'error' or message.tags == 'danger' %}
                <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600"></i>
            {% elif message.tags == 'warning' %}
                <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600"></i>
            {% else %}
                <i data-lucide="info" class="w-5 h-5 text-blue-600"></i>
            {% endif %}
        </div>
        <div class="flex-1">
            {{ message }}
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="ml-auto -mx-1.5 -my-1.5 p-1.5 rounded-lg hover:bg-black/5 inline-flex h-8 w-8 items-center justify-center text-current opacity-70 hover:opacity-100">
            <span class="sr-only">Dismiss</span>
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
